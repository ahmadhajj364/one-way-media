<!doctype html>
<html lang="en">

<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">

<title>One Way Media Dashboard</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: navy sidebar + calm light work surface; mobile switches to top bar + bottom tabs. Brand navy/green from the logo, used sparingly. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#F7F9FB; --hover:#EEF2F7;
  --line:#E3E8EF; --line-2:#CDD5E0;
  --text:#1D2939; --muted:#667085; --faint:#98A2B3;
  --brand:#082A59; --brand-text:#082A59;
  --green:#16825C; --green-hi:#12704F; --green-soft:#E6F4EC; --green-text:#0F6B4A;
  --red:#C4320A; --red-soft:#FDECE7; --amber:#B54708; --amber-soft:#FEF3E2; --blue:#1E5AA8; --blue-soft:#E9F0FA; --gray-soft:#EEF1F5;
  --side:#082A59; --side-2:#0C3570; --side-text:#BCCBE2;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);
  --pop:0 12px 32px rgba(16,24,40,.18);
  --ui:"Instrument Sans","Segoe UI",Helvetica,Arial,sans-serif;
  --head:"Archivo","Segoe UI",Helvetica,Arial,sans-serif;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1322; --surface:#111C30; --surface-2:#15213A; --hover:#1A2844;
  --line:#22314F; --line-2:#2F4268;
  --text:#E5EBF4; --muted:#97A5BC; --faint:#6E7D97;
  --brand:#0A2C5E; --brand-text:#BFD1F0;
  --green:#1E9A6C; --green-hi:#23AF7B; --green-soft:rgba(35,175,123,.14); --green-text:#5FD0A2;
  --red:#F0704F; --red-soft:rgba(240,112,79,.14); --amber:#F2A54A; --amber-soft:rgba(242,165,74,.14); --blue:#7FAAE8; --blue-soft:rgba(127,170,232,.14); --gray-soft:rgba(151,165,188,.12);
  --side:#071A38; --side-2:#0C2A57; --side-text:#A9BAD6;
  --shadow:0 1px 2px rgba(0,0,0,.3); --pop:0 16px 40px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1322; --surface:#111C30; --surface-2:#15213A; --hover:#1A2844;
  --line:#22314F; --line-2:#2F4268;
  --text:#E5EBF4; --muted:#97A5BC; --faint:#6E7D97;
  --brand:#0A2C5E; --brand-text:#BFD1F0;
  --green:#1E9A6C; --green-hi:#23AF7B; --green-soft:rgba(35,175,123,.14); --green-text:#5FD0A2;
  --red:#F0704F; --red-soft:rgba(240,112,79,.14); --amber:#F2A54A; --amber-soft:rgba(242,165,74,.14); --blue:#7FAAE8; --blue-soft:rgba(127,170,232,.14); --gray-soft:rgba(151,165,188,.12);
  --side:#071A38; --side-2:#0C2A57; --side-text:#A9BAD6;
  --shadow:0 1px 2px rgba(0,0,0,.3); --pop:0 16px 40px rgba(0,0,0,.5);
  color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--ui);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-text);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px 16px;gap:18px;overflow-y:auto}
.side-brand{display:flex;align-items:center;gap:10px;padding:2px 8px 6px;text-decoration:none}
.side-brand svg{height:24px;width:auto}
.side-brand span{font-family:var(--head);font-stretch:118%;font-weight:600;font-size:10.5px;letter-spacing:.2em;color:#fff;white-space:nowrap}
.nav{display:grid;gap:2px}
.nav-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#7F93B5;padding:10px 10px 4px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border:0;border-radius:8px;background:transparent;color:var(--side-text);cursor:pointer;text-align:start;font-size:14.5px}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button[aria-current="page"]{background:var(--side-2);color:#fff;box-shadow:inset 3px 0 0 #2BB884}
.badge{margin-inline-start:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#2BB884;color:#05301F;font-size:11.5px;font-weight:650;display:grid;place-items:center}
.badge.warn{background:#F5A04A;color:#3B1E00}
.side-foot{margin-top:auto;display:grid;gap:10px;padding:0 6px}
.demo-note{font-size:12px;line-height:1.45;color:#8EA2C2;border:1px dashed rgba(188,203,226,.25);border-radius:8px;padding:10px}
.who{display:flex;align-items:center;gap:10px;font-size:13px;color:#DCE5F3}
.avatar{width:30px;height:30px;border-radius:50%;background:#16825C;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:650}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:none}
.content{padding:26px clamp(16px,3vw,36px) 60px;max-width:1360px;width:100%;margin-inline:auto;display:grid;gap:20px;align-content:start}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.page-h h1{margin:0;font-family:var(--head);font-stretch:108%;font-weight:650;font-size:26px;letter-spacing:-.01em;color:var(--brand-text);line-height:1.15}
.page-h p{margin:4px 0 0;color:var(--muted);font-size:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);cursor:pointer;font-size:14px;font-weight:550;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-hi)}
.btn.danger{color:var(--red);border-color:transparent;background:transparent}
.btn.danger:hover{background:var(--red-soft)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:7px}
.btn svg.i{width:16px;height:16px}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer}
.icon-btn:hover{background:var(--hover)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card-h h2,.card-h h3{margin:0;font-size:15px;font-weight:650}
.card-b{padding:14px 16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
@media (max-width:1180px){.grid3{grid-template-columns:1fr 1fr}.grid4{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
@media (max-width:700px){.grid3{grid-template-columns:1fr}.grid4{gap:10px}.kpi{padding:12px}.kpi .v{font-size:20px}}

/* attention cards */
.att .card-h{border-bottom:0;padding-bottom:4px}
.att-num{display:flex;align-items:baseline;gap:10px;padding:0 16px 12px}
.att-num b{font-family:var(--head);font-size:34px;font-weight:650;line-height:1;color:var(--brand-text)}
.att-num span{font-size:13px;color:var(--muted)}
.att.alert .att-num b{color:var(--red)}
.att-ico{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--gray-soft);color:var(--muted)}
.att.alert .att-ico{background:var(--red-soft);color:var(--red)}
.att.okay .att-ico{background:var(--green-soft);color:var(--green-text)}
.list{display:grid}
.li{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line);min-width:0}
.li-main{min-width:0;flex:1}
.li-t{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .btn{flex:none}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c,#999)}
.empty{padding:18px 16px;color:var(--muted);font-size:14px;display:flex;gap:10px;align-items:center}
.empty svg{color:var(--green-text)}

.kpi{padding:16px}
.kpi .k{font-size:12.5px;color:var(--muted);font-weight:550}
.kpi .v{font-family:var(--head);font-size:24px;font-weight:650;margin-top:4px;color:var(--brand-text)}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.kpi .v.neg{color:var(--red)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:11px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--gray-soft);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.green{background:var(--green-soft);color:var(--green-text)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}

/* tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:start;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:var(--hover)}
.tbl .num{text-align:end;white-space:nowrap}
.tbl .act{text-align:end;white-space:nowrap}
.client-cell{display:flex;align-items:center;gap:9px;min-width:0}
@media (max-width:760px){
  .tbl.stack thead{display:none}
  .tbl.stack, .tbl.stack tbody, .tbl.stack tr, .tbl.stack td{display:block;width:100%}
  .tbl.stack tr{padding:10px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:2px 12px}
  .tbl.stack td{border:0;padding:0}
  .tbl.stack td[data-l]::before{content:attr(data-l) " · ";color:var(--faint);font-size:12px}
  .tbl.stack td.num{text-align:start}
  .tbl.stack td.act{grid-column:1/-1;text-align:start;padding-top:6px}
  .tbl.stack td.wide{grid-column:1/-1}
}

/* tabs / segmented */
.seg{display:inline-flex;background:var(--gray-soft);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;font-size:13.5px;color:var(--muted);font-weight:550;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.seg .n{font-size:12px;color:var(--faint);margin-inline-start:4px}
select.ctl,input.ctl{height:38px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:0 10px;min-width:0}

/* forms */
.form{display:grid;gap:14px}
.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.frow.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:600px){.frow,.frow.three{grid-template-columns:1fr}}
.f{display:grid;gap:5px;min-width:0}
.f label,.flabel{font-size:12.5px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:9px 11px;min-height:38px}
.f textarea{min-height:76px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--green)}
.form-err{color:var(--red);font-size:13.5px;background:var(--red-soft);padding:9px 12px;border-radius:8px}
.hint{font-size:12.5px;color:var(--muted)}
.section-t{font-size:12px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--green-text);margin:6px 0 -4px}

/* line items */
.items{display:grid;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) 70px 110px 96px 32px;gap:8px;align-items:center}
.item input{width:100%;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:8px 10px;height:38px}
.item .amt{text-align:end;font-weight:600}
.items-h{display:grid;grid-template-columns:minmax(0,1fr) 70px 110px 96px 32px;gap:8px;font-size:12px;color:var(--muted);font-weight:600}
.items-h span:nth-child(4){text-align:end}
@media (max-width:600px){.item,.items-h{grid-template-columns:1fr 60px 84px 28px}.item .amt,.items-h span:nth-child(4){display:none}}
.totals{display:grid;justify-content:end;gap:4px;font-size:14px}
.totals div{display:flex;justify-content:space-between;gap:30px}
.totals .grand{font-weight:700;font-size:16px;color:var(--brand-text);border-top:1px solid var(--line);padding-top:6px;margin-top:2px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(8,20,40,.48);z-index:60;display:grid;place-items:center;padding:20px}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--pop);width:min(640px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;overflow:hidden}
.modal.wide{width:min(860px,100%)}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h2{margin:0;font-size:17px;font-weight:650}
.modal-b{padding:18px 20px;overflow-y:auto}
.modal-f{display:flex;align-items:center;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap;background:var(--surface-2)}
.modal-f .spacer{flex:1}
@media (max-width:700px){.modal-bg{padding:0;align-items:end}.modal{width:100%;max-height:92vh;border-radius:16px 16px 0 0}}

/* toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#0F1B30;color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;z-index:80;box-shadow:var(--pop);display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px)}
@media (max-width:900px){.toast{bottom:84px}}

/* calendar */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:1100px){.cal-wrap{grid-template-columns:1fr}}
.cal-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.cal-head h2{margin:0;font-size:17px;font-weight:650;min-width:150px}
.cal-dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line)}
.cal-dow span{padding:8px 8px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cell{min-height:118px;border-inline-end:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;background:var(--surface);text-align:start;border-top:0;border-inline-start:0;font:inherit;color:inherit}
.cell:nth-child(7n){border-inline-end:0}
.cell:hover{background:var(--hover)}
.cell.out{background:var(--surface-2)}
.cell.out .dn{color:var(--faint)}
.cell.sel{box-shadow:inset 0 0 0 2px var(--green)}
.dn{font-size:13px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cell.today .dn{background:var(--green);color:#fff}
.ev{display:flex;align-items:center;gap:5px;font-size:12px;line-height:1.25;padding:2px 6px;border-radius:5px;background:color-mix(in srgb,var(--c) 13%,var(--surface));border-inline-start:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ev svg.i{width:12px;height:12px}
.ev.done{opacity:.55}
.ev.late{background:var(--red-soft);border-inline-start-color:var(--red);color:var(--red)}
.more-n{font-size:11.5px;color:var(--muted);padding-inline-start:4px}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.dots i.sq{border-radius:1px;width:7px;height:7px}
@media (max-width:760px){
  .cell{min-height:58px;padding:4px}
  .cell .ev,.cell .more-n{display:none}
  .dots{display:flex}
  .cal-dow span{padding:6px 2px;text-align:center;font-size:11px}
  .dn{margin-inline:auto}
}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.agenda .li{align-items:flex-start}
.type-ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);flex:none}
.type-ico svg.i{width:16px;height:16px}

/* leads board */
.board{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px;align-items:start}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;font-weight:650;font-size:14px}
.col-h .n{font-size:12px;color:var(--muted);background:var(--gray-soft);border-radius:9px;padding:1px 8px}
.col-b{display:grid;gap:8px;padding:0 8px 10px}
.lead{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:11px 12px;display:grid;gap:7px;cursor:pointer;box-shadow:var(--shadow);text-align:start;font:inherit;color:inherit;width:100%}
.lead:hover{border-color:var(--line-2)}
.lead-t{font-weight:600;line-height:1.3}
.lead-s{font-size:12.5px;color:var(--muted)}
.fu{display:flex;align-items:center;gap:8px;font-size:12.5px}
.fu-dots{display:flex;gap:4px}
.fu-dots i{width:18px;height:6px;border-radius:3px;background:var(--line-2)}
.fu-dots i.on{background:var(--green)}
.fu.due{color:var(--amber)} .fu.late{color:var(--red)}
.lead-acts{display:flex;gap:6px;flex-wrap:wrap}
.col-empty{font-size:13px;color:var(--faint);padding:6px 6px 4px}

/* clients */
.clients{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.cl{display:grid;gap:12px;padding:16px;cursor:pointer;text-align:start;font:inherit;color:inherit;border-top:4px solid var(--c)}
.cl:hover{border-color:var(--line-2);border-top-color:var(--c)}
.cl-t{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.cl-t b{font-size:16px;line-height:1.3}
.cl-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:13px}
.cl-meta .k{color:var(--muted);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}

lay:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--green-d);background:rgba(29,154,104,.1);padding:6px 12px;border-radius:999px;justify-self:start}\n.status i{width:8px;height:8px;border-radius:50%;background:var(--green)}\n@media (max-width:860px){.studio-band{grid-template-columns:1fr}}\n\n/* final call */\n.final{position:relative;overflow:hidden}\n.final-inner{display:grid;gap:30px;position:relative;z-index:1}\n.final-inner .h2{max-width:20ch}\n.final-mark{position:absolute;inset-inline-end:-6%;bottom:-18%;width:min(640px,60vw);opacity:.06;pointer-events:none}\n\n/* page heads */\n.page-head{padding:clamp(48px,7vw,96px) 0 clamp(48px,6vw,80px)}\n.page-head .wrap{display:grid;gap:20px;max-width:none}\n.page-head .h1{font-size:clamp(36px,5.2vw,68px);max-width:18ch}\nhtml[lang=\"ar\"] .page-head .h1{max-width:22ch}\n.page-head .lead{color:var(--on-navy)}\n\n/* services page */\n.svc-full{display:grid;gap:0;border-top:1.5px solid var(--ink)}\n.svc-card{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(20px,4vw,64px);padding:clamp(32px,4vw,48px) 0;border-bottom:1px solid var(--line)}\n.svc-card .h2{font-size:clamp(28px,3vw,40px)}\n.svc-card p{color:var(--slate)}\n.svc-card .left{display:grid;gap:14px;align-content:start}\n.inc-label{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:10px}\n@media (max-width:860px){.svc-card{grid-template-columns:1fr}}\n.price{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,5vw,72px);align-items:start}\n.factors{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--ink)}\n.factors li{padding:18px 0;border-bottom:1px solid var(--line);font-weight:500;font-size:18px;display:flex;align-items:center;gap:14px}\n.factors li::before{content:\"\";width:10px;height:10px;border-radius:2px;background:var(--green);flex:none}\n.price-plate{font-weight:700;font-size:20px;color:var(--navy)}\n@media (max-width:860px){.price{grid-template-colu /* ---------- utils ---------- */
function pad(n){ return (n<10?"0":"")+n; }
function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function hhmm(d){ return pad(d.getHours())+":"+pad(d.getMinutes()); }
function parse(s){ var p=s.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]||1); }
function addDays(s,n){ var d=parse(s); d.setDate(d.getDate()+n); return iso(d); }
function addMonths(ym,n){ var d=parse(ym+"-01"); d.setMonth(d.getMonth()+n); return iso(d).slice(0,7); }
var TODAY = iso(new Date());
var YM = TODAY.slice(0,7);
function daysIn(ym){ var d=parse(ym+"-01"); return new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); }
function fmtD(s){ return s ? parse(s).toLocaleDateString("en-GB",{day:"numeric",month:"short"}) : ""; }
function fmtDY(s){ return s ? parse(s).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}) : ""; }
function fmtDay(s){ return parse(s).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"}); }
function fmtDayS(s){ return s===TODAY?"Today":(s===addDays(TODAY,1)?"Tomorrow":parse(s).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})); }
function fmtM(ym){ return parse(ym+"-01").toLocaleDateString("en-GB",{month:"long",year:"numeric"}); }
function pdfDate(s){ return s ? s.split("-").reverse().join(" / ") : "DD / MM / YYYY"; }
function money(n){ return "$"+Number(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function money0(n){ n=Math.round(Number(n||0)); return (n<0?"−$":"$")+Math.abs(n).toLocaleString("en-US"); }
function num2(n){ return Number(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function uid(){ return Math.random().toString(36).slice(2,10); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function digits(p){ return String(p||"").replace(/\D/g,""); }
function daysBetween(a,b){ return Math.round((parse(b)-parse(a))/86400000); }
function ico(id,cls){ return '<svg class="i '+(cls||"")+'"><use href="#i-'+id+'"/></svg>'; }
function sum(arr,f){ return arr.reduce(function(a,x){ return a+(f?f(x):x); },0); }
function hm(t){ var p=String(t||"0:0").split(":"); return (+p[0])+(+p[1])/60; }
function addMin(t,m){ var x=Math.round(hm(t)*60)+m; x=Math.max(0,Math.min(24*60-1,x)); return pad(Math.floor(x/60))+":"+pad(x%60); }
function first(n){ return String(n||"").split(" ")[0]; }
function inMins(ms){ var m=Math.max(0,Math.round(ms/60000)); return m<60? m+" min" : Math.floor(m/60)+" h"+(m%60?" "+m%60+" min":""); }

function shrinkImage(file,maxW,type,cb){

    c.getContext("2d").drawImage(img,0,0,c.width,c.height); var u=c.toDataURL(type,.8);
    if(type==="image/png" && u.length>120000){ var wp=c.toDataURL("image/webp",.86); if(wp.indexOf("data:image/webp")===0 && wp.length<u.length) u=wp; }
    cb(u); }; img.onerror=function(){ toast("That file isn't an image we can read."); }; img.src=r.result; }; r.readAsDataURL(file);
}

  var st=ST(), d=bookingDraft(), calc=document.getElementById("b-calc"), price=document.getElementById("b-price");
  var auto = d.kind==="daily" ? st.day : (+d.dur)*st.hour;
  if(!init && form.dataset.priceTouched!=="1") price.value=auto;
  calc.textContent = d.kind==="daily" ? "Full day rate, "+st.open+"–"+st.close : d.dur+" h × $"+st.hour+" · ends at "+d.end;
  if(d.kind==="daily"){ document.getElementById("b-start").value=st.open; }
  var box=document.getElementById("b-rem"), startD=bStart({date:d.date||TODAY,start:d.start}), mins=(startD-new Date())/60000;
  if(!d.date) box.innerHTML='<div class="rem-note off">'+ico("alert")+'<span>Pick a date to see when the reminder goes out.</span></div>';
  else if(d.walkin) box.innerHTML='<div class="rem-note off">'+ico("alert")+'<span>Walk-in: no reminder is sent.</span></div>';
  else if(mins<st.remind) box.innerHTML='<div class="rem-note off">'+ico("alert")+'<span>Starts in less than '+st.remind+' minutes, so no reminder is needed.</span></div>';
  else box.innerHTML='<div class="rem-note">'+ico("alert")+'<span>The dashboard will remind you to message them at <b>'+hhmm(new Date(startD.getTime()-st.remind*60000))+'</b>'+(d.date===TODAY?' today':(d.date===addDays(TODAY,1)?' tomorrow':' on '+fmtDayS(d.date)))+', '+st.remind+' minutes before the session.</span></div>';
}

function collectDoc(kind,form){
  var id=form.dataset.id, list=kind==="quote"?S.quotes:S.invoices;
  var d=id?list.find(function(x){ return x.id===id; }):{id:uid()};
  var items=readItems(); if(!items.length){ showErr("Add at least one line."); return null; }
  if(items.some(function(i){ return (+i.q||0)<0; })){ showErr("A quantity can't be below 0."); return null; }
  if(itemsTotal({items:items,tax:+fv("d-tax")||0}).total<0){ showErr("The total can't be below $0. Check the amounts (a discount line can be negative, but not more than the rest)."); return null; }
  if(kind==="invoice" && fv("d-split")==="1"){ var _sp=+fv("d-splitpct"); if(!(_sp>=1&&_sp<=99)||Math.round(_sp)!==_sp){ showErr("The upfront part must be a whole % between 1 and 99."); return null; } }
  if(kind==="invoice"){ if(!fv("d-issue")){ showErr("Add the issue date."); return null; } if(!fv("d-due")){ showErr("Add the due date."); return null; } if(fv("d-due")<fv("d-issue")){ showErr("The due date is before the issue date."); return null; } }
  else if(!fv("d-date")){ showErr("Add the quote date."); return null; }
  if(!fv(kind==="quote"?"d-toperson":"d-person")){ showErr("Add the client's name."); return null; }
  if(!fv(kind==="quote"?"d-to":"d-biz")){ showErr("Add the business name."); return null; }
  var number=fv("d-num"); if(!number){ showErr("Add a number."); return null; }
  if(list.some(function(x){ return x.number===number && x.id!==d.id; })){ showErr(number+" is already used. Pick another number."); return null; }
  d.number=number; var fe=fv("d-from").trim(); d.fromEmail=fe; S.settings.company.email=fe; d.preparedBy=nameCase(fv("d-prep")); if(d.preparedBy) S.settings.lastPrep=d.preparedBy; d.items=items; d.tax=+fv("d-tax")||0; d.notes=document.getElementById("d-notes").value; d.terms=document.getElementById("d-terms").value;
  if(kind==="quote"){
    
    var prevSt=d.status; d.date=fv("d-date"); d.validUntil=fv("d-valid"); d.toName=fv("d-to"); d.toPerson=fv("d-toperson"); d.toAddress=fv("d-addr"); d.toEmail=fv("d-email"); d.toPhone=fv("d-phone"); d.status=fv("d-status"); d.noLateClause=fv("d-nolate")==="1"; d.leadId=fv("d-lead"); d.clientId=d.clientId||"";
    if(!id){ S.quotes.push(d); bumpNumber("quote",number); }
    if(d.status==="accepted" && prevSt!=="accepted" && !(d.clientId && client(d.clientId).id)) ONBOARD={q:d.id};
    if(d.leadId){ var l=S.leads.find(function(x){ return x.id===d.leadId; }); if(l){ l.quoteId=d.id;
      if(d.status==="sent" && l.stage==="new"){ l.stage="quote_sent"; l.quoteSentAt=TODAY; l.followups=[]; }
      if(d.status==="accepted" && l.stage!=="won"){ l.stage="won"; l.closedAt=TODAY; }
      if(d.status==="declined") l.stage="lost"; } }
  } else {
    var wasPaid=d.status==="paid";
    if(fv("d-client")==="__other"){ d.clientId=""; d.toName=fv("d-biz"); d.toPhone=fv("d-ophone"); d.toEmail=fv("d-oemail"); d.toAddress=fv("d-oaddr"); }
    else { d.clientId=fv("d-client"); delete d.toName; delete d.toPhone; delete d.toEmail; delete d.toAddress; }
    d.toPerson=fv("d-person"); d.toBiz=fv("d-biz"); d.issue=fv("d-issue"); d.due=fv("d-due"); d.month=d.month||d.issue.slice(0,7);
    var stv=fv("d-status"); d.split=fv("d-split")==="1"?Math.round(+fv("d-splitpct")):0; if(d.split) S.settings.lastSplit=d.split;
    d.status=stv==="paid"?"paid":"unpaid";
    if(stv==="deposit" && d.split) d.depositAt=d.depositAt||TODAY; else if(stv!=="paid" || !d.split) d.depositAt="";
    var AUTO=/% is paid upfront and \d+% once the work is done\.$/;
    if(d.split && (!d.terms || d.terms===S.settings.invTerms || AUTO.test(d.terms))) d.terms=d.split+"% is paid upfront and "+(100-d.split)+"% once the work is done.";
    else if(!d.split && AUTO.test(d.terms||"")) d.terms=S.settings.invTerms;
    d.waiveLate=fv("d-waive")==="1";
    if(d.status==="paid" && !wasPaid){ d.paidAt=TODAY; d.lateFeeCharged=lateFeeOn(d,TODAY); } if(d.status!=="paid"){ d.paidAt=""; d.lateFeeCharged=0; }
    if(!id){ S.invoices.push(d); bumpNumber("invoice",number); }
  }
  form.dataset.id=d.id;
  return d;
}

function cloudImportRequests(){
  if(!CLOUD.on || !CLOUD.user || !CLOUD.ready) return;
  CLOUD.sb.from("quote_requests").select("*").order("created_at",{ascending:false}).limit(200).then(function(r){
    if(r.error || !r.data) return;
    S.reqSeen=S.reqSeen||{}; var added=[];
    r.data.slice().reverse().forEach(function(q){
      if(S.reqSeen[q.id]) return; S.reqSeen[q.id]=1;
      var lid="web-"+q.id; if(S.leads.some(function(l){ return l.id===lid; })) return;
      var srcName={meta:"Meta",google:"Google",direct:"a direct visit",other:"another website"}[q.source]||"the website";
      var notes=["Quote request from the website (came from "+srcName+")",
        q.services?"Looking for: "+q.services:"", q.budget?"Budget: "+q.budget:"", q.start?"Start: "+q.start:"",
        q.instagram?"Instagram: "+q.instagram:"", q.message?"Message: "+q.message:""].filter(Boolean).join("\n");
      S.leads.push({id:lid,created:(q.created_at?iso(new Date(q.created_at)):TODAY),followups:[],quoteSentAt:"",source:q.source==="meta"?"meta":(q.source==="google"?"google":"website"),
        business:q.business||q.name,name:q.name||q.business,phone:q.phone||"",industry:q.industry||"",stage:"new",quoteId:"",notes:notes,fromWeb:true});
      added.push(q); });
    if(added.length){ save(); if(!modalOpen()){ var y=window.scrollY; render(); window.scrollTo(0,y); }
      toast(added.length===1?"New quote request from "+(added[0].name||added[0].business)+". It's in Leads.":added.length+" new quote requests from the website. They're in Leads."); }
  },function(){});
}
